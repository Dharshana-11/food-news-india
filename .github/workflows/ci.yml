name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install server dependencies
        run: |
          cd server
          npm ci
          npm run lint || true
      - name: Test server
        run: |
          cd server
          npm test || true
      - name: Build client
        run: |
          cd client
          npm ci
          npm run build || true
